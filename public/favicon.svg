<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cream paper background -->
  <rect width="32" height="32" rx="6.5" fill="#f7f5f0"/>

  <!-- Hand-drawn "A" — slightly imperfect strokes -->
  <g fill="none" stroke="#0d0d0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left leg (wavy, slightly off-perfect) -->
    <path d="M 7.8 25.8 Q 10.4 18.6 12.6 12.8 Q 14.5 7.6 16.2 6.4"/>
    <!-- Right leg -->
    <path d="M 16.2 6.4 Q 18.1 8.4 20.2 14 Q 22.6 20.4 24.4 25.8"/>
    <!-- Crossbar (organic wobble) -->
    <path d="M 10.8 19.2 Q 13.5 18.6 16.2 18.8 Q 19.2 19.0 21.4 19.4"/>
  </g>

  <!-- Orange accent dot — like a pen-stamp full stop -->
  <circle cx="26.6" cy="25.6" r="1.7" fill="#e8825c"/>
</svg>
