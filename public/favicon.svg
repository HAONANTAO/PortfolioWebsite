<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Gradient border -->
  <rect x="0.8" y="0.8" width="30.4" height="30.4" rx="6.4"
    fill="none" stroke="url(#g)" stroke-width="1.4"/>

  <!-- Corner accents -->
  <polyline points="2,7 2,2 7,2"   fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round"/>
  <polyline points="25,2 30,2 30,7" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
  <polyline points="2,25 2,30 7,30" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
  <polyline points="25,30 30,30 30,25" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round"/>

  <!-- TAO text -->
  <text x="16" y="21"
    font-family="'Courier New', Courier, monospace"
    font-size="10.5"
    font-weight="900"
    text-anchor="middle"
    letter-spacing="1.5"
    fill="url(#g)">TAO</text>
</svg>
